name: Compilar Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # La clave de depuración del runner es efímera: sin esto, cada compilación
      # firma el APK con una clave distinta y Android obliga a desinstalar para
      # actualizar. La caché conserva la misma clave entre ejecuciones.
      - name: Conservar clave de firma de depuración
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Instalar Android SDK 35
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar y ejecutar tests
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Publicar APK de Bitácora
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK de Jarvis
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: assistant/build/outputs/apk/debug/assistant-debug.apk
          if-no-files-found: error
          retention-days: 30
