name: Compilar Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # La clave de firma está versionada en assistant/debug.keystore. Así
      # todas las compilaciones usan la misma y las actualizaciones se instalan
      # encima sin desinstalar ni perder datos.
      - name: Verificar clave de firma estable
        run: |
          test -f assistant/debug.keystore
          keytool -list -v -keystore assistant/debug.keystore \
            -storepass android -alias androiddebugkey | grep -E "SHA256|Valid"

      - name: Instalar Android SDK 35
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar y ejecutar tests
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      # Comprueba que el APK se ha firmado con la clave versionada y no con
      # una clave efímera del runner. Así las actualizaciones se instalan encima.
      - name: Verificar firma del APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs assistant/build/outputs/apk/debug/assistant-debug.apk
          EXPECTED=$(keytool -list -v -keystore assistant/debug.keystore \
            -storepass android -alias androiddebugkey \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL=$("$APKSIGNER" verify --print-certs \
            assistant/build/outputs/apk/debug/assistant-debug.apk \
            | grep -i "SHA-256" | head -1 | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Huella esperada: $EXPECTED"
          echo "Huella del APK:  $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Publicar APK de Bitácora
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK de Jarvis
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: assistant/build/outputs/apk/debug/assistant-debug.apk
          if-no-files-found: error
          retention-days: 30
